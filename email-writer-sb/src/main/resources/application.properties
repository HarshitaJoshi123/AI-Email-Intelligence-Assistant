spring.application.name=email-writer-sb

# ================================
# Gemini
# ================================

gemini.api.url=${GEMINI_API_URL}
gemini.api.key=${GEMINI_API_KEY}


# ================================
# PostgreSQL
# ================================

spring.datasource.url=jdbc:postgresql://localhost:5432/email_assistant
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ================================
# Twilio WhatsApp
# ================================

# Twilio Account SID
twilio.account.sid=${TWILIO_ACCOUNT_SID}

# Twilio Auth Token
twilio.auth.token=${TWILIO_AUTH_TOKEN}

# Twilio WhatsApp sender
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM}

# Your WhatsApp number
twilio.whatsapp.to=${TWILIO_WHATSAPP_TO}

twilio.whatsapp.content.sid=${TWILIO_WHATSAPP_CONTENT_SID}


# ================================
# Error Details
# ================================

server.error.include-message=always
server.error.include-binding-errors=always